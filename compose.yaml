services:
  app-web:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # Copy .env.dist to .env before starting; .env is never committed.
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Source bind mount so uvicorn --reload picks up local edits.
      - ./backend:/app
    command: ["--reload", "--reload-dir", "/app/app"]
    depends_on:
      postgres:
        # The entrypoint runs `alembic upgrade head`, so the database must
        # accept connections before the container starts.
        condition: service_healthy

  app-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    volumes:
      # Same source bind mount as app-web: one image, two roles.
      - ./backend:/app
    # The image entrypoint migrates and starts uvicorn; the worker must do
    # neither. Schema migration belongs to app-web alone.
    entrypoint: []
    # The module list grows as job families are added.
    command:
      [
        "taskiq",
        "worker",
        "app.jobs.broker:broker",
        "app.jobs.demo",
        "app.jobs.ingestion",
        "app.jobs.embeddings",
        "app.jobs.chat",
      ]
    depends_on:
      postgres:
        # Jobs write operation state, so the database must accept connections.
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    environment:
      # The SPA calls the backend from the browser, so this is the host-side
      # URL, not the Compose service name. Deliberately set here and not in
      # .env: it is a fixed development value, not a secret.
      VITE_API_URL: http://localhost:8000
      # Bind mounts do not reliably propagate inotify events into containers;
      # see vite.config.ts.
      VITE_SERVER_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      # Source bind mount so Vite HMR picks up local edits.
      - ./frontend:/app
      # Anonymous volume keeping the image's node_modules from being shadowed
      # by the bind mount (the host tree has none inside the container's view).
      # Recreate it after changing dependencies: `docker compose up --build
      # --force-recreate --renew-anon-volumes frontend`.
      - /app/node_modules

  # One-off CLI containers (profile `cli`: not started by `docker compose up`,
  # invoked via `docker compose run --rm <service> <cmd>` — see the Makefile).
  # They reuse the app build definitions, so `make build` keeps them fresh.
  app-cli:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app
    # The image's entrypoint runs migrations + uvicorn; the CLI runs whatever
    # command is passed to `docker compose run` instead.
    entrypoint: []
    profiles:
      - cli

  node-cli:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      # Fresh anonymous node_modules from the image for each run.
      - /app/node_modules
    profiles:
      - cli

  postgres:
    # pgvector ships the extension the RAG store needs; plain postgres:16 does not.
    image: pgvector/pgvector:pg16
    # Development credentials. They must match DATABASE_URL in .env
    # (see .env.dist): postgresql+psycopg://app:app@postgres:5432/application
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: application
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d application"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # Taskiq broker only (see app-worker); the app never stores state here,
    # so no volume and no readiness coupling.
    image: redis:7-alpine

  # --- Optional Langfuse tracing stack (profile "langfuse") -----------------
  # Not started by plain `docker compose up`; opt in with
  # `docker compose --profile langfuse up -d`. Bonus/dev-only: six services
  # implementing Langfuse's current self-hosted "v3" architecture (Postgres +
  # ClickHouse + S3-compatible blob store + Redis-protocol queue, fronted by
  # a web app and an async worker), following the reference compose at
  # https://github.com/langfuse/langfuse/blob/main/docker-compose.yml, image
  # generation "4" to match the `langfuse` Python SDK pinned in 5.9
  # (`langfuse~=4.0`, resolved 4.15.1). Images are pulled from Docker Hub
  # (`langfuse/langfuse`, `langfuse/langfuse-worker`) rather than the
  # project's own `docker.langfuse.com` registry, which does not resolve from
  # this environment's network — same published image, reachable mirror.
  #
  # A dedicated `langfuse-postgres` is used instead of the shared pgvector
  # `postgres` service: simpler and safer than an initdb script on a running
  # instance whose existing volume would never re-run init anyway.
  #
  # All secrets below (SALT, ENCRYPTION_KEY, NEXTAUTH_SECRET, the three
  # passwords) are generated dev-only defaults, fine for a local bonus
  # stack — never reuse them anywhere real. Nothing here is published to a
  # host port except langfuse-web's UI (3000, chosen to avoid the app's
  # 5173/8000/5432/6379); every other service is reachable only inside the
  # Compose network.
  langfuse-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: 9b32e7874ae161881e3778f8451309df # generated dev secret
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles:
      - langfuse

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ce4fa8b02593c4de5a16ab6347a84e60 # generated dev secret
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    profiles:
      - langfuse

  valkey:
    # Redis-protocol queue for Langfuse's ingestion pipeline; named `valkey`
    # (not `redis`) to stay unambiguous next to the app's own `redis` service
    # above — they are unrelated brokers on unrelated networks-of-concern.
    image: valkey/valkey:7-alpine
    command: >
      --requirepass 30ec8e4d64dcdf638ffba7a6d3416a78
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    profiles:
      - langfuse

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    # Pre-creates the "langfuse" bucket before starting the server.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: 0fa33030e4532927db9af4fbd49cd760 # generated dev secret
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    profiles:
      - langfuse

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:9b32e7874ae161881e3778f8451309df@langfuse-postgres:5432/langfuse
      SALT: 903ba635ec22df223f69c8024c42e1de # generated dev secret
      ENCRYPTION_KEY: c9da99967697f0775e4ddb698b2953518c8551378066047136e0d909f84f7854 # generated dev secret
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ce4fa8b02593c4de5a16ab6347a84e60 # generated dev secret
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: 0fa33030e4532927db9af4fbd49cd760 # generated dev secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: 0fa33030e4532927db9af4fbd49cd760 # generated dev secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_AUTH: 30ec8e4d64dcdf638ffba7a6d3416a78 # generated dev secret
    profiles:
      - langfuse

  langfuse-web:
    image: langfuse/langfuse:4
    depends_on: *langfuse-depends-on
    # UI port. Chosen to avoid the app stack's 5173 (frontend)/8000
    # (app-web)/5432 (postgres)/6379 (redis) — see .env.dist's LANGFUSE_HOST
    # comment.
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: 70dc22e689f893fd5e6546a5f23c0e7f8c9d280a8e47a25b238f430fd27f1793 # generated dev secret
    profiles:
      - langfuse

volumes:
  postgres-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
